[workspace]
resolver = "2"
members = [
    "crates/sc-cli",
    "crates/sc-core",
    "crates/sc-graph",
    "crates/sc-engines",
    "crates/sc-mutation",
    "crates/sc-llm",
    "crates/sc-mcp",
    "crates/sc-sarif",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/moonbase2090/Scorecard"
homepage = "https://github.com/moonbase2090/Scorecard"
readme = "README.md"
keywords = ["quality", "testing", "metrics", "sarif", "gate"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
uuid = { version = "1", features = ["v4"] }
