[package]
name = "sc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "sc command line"

[[bin]]
name = "sc"
path = "src/main.rs"

[features]
default = []

[dependencies]
sc-core = { path = "../sc-core" }
sc-engines = { path = "../sc-engines" }
sc-sarif = { path = "../sc-sarif" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
