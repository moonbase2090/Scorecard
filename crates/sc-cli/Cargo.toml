[package]
name = "sc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false
description = "sc command line"

[[bin]]
name = "sc"
path = "src/main.rs"

[features]
default = []
tui = ["dep:lunatui-core", "dep:lunatui-runtime", "dep:lunatui-term", "dep:lunatui-theme", "dep:lunatui-widgets", "dep:terminal_size", "dep:url"]

[dependencies]
lunatui-core = { git = "https://github.com/moonbase2090/lunatui", rev = "dbf6f6d6575b4caf45c40b39c7567103a1a185f0", optional = true }
lunatui-runtime = { git = "https://github.com/moonbase2090/lunatui", rev = "dbf6f6d6575b4caf45c40b39c7567103a1a185f0", optional = true, features = ["app"] }
lunatui-term = { git = "https://github.com/moonbase2090/lunatui", rev = "dbf6f6d6575b4caf45c40b39c7567103a1a185f0", optional = true }
lunatui-theme = { git = "https://github.com/moonbase2090/lunatui", rev = "dbf6f6d6575b4caf45c40b39c7567103a1a185f0", optional = true }
lunatui-widgets = { git = "https://github.com/moonbase2090/lunatui", rev = "dbf6f6d6575b4caf45c40b39c7567103a1a185f0", optional = true }
url = { version = "2", optional = true }
terminal_size = { version = "0.4", optional = true }
sc-core = { path = "../sc-core" }
sc-engines = { path = "../sc-engines" }
sc-sarif = { path = "../sc-sarif" }
anstyle = "1.0.14"
clap.workspace = true
libc = "0.2.189"
serde_json.workspace = true

[dev-dependencies]
termlens = { version = "=0.11.6", default-features = false }

[[test]]
name = "tui"
required-features = ["tui"]
