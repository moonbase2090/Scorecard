name: sc
description: Run the sc scorecard gate and upload SARIF
inputs:
  spec:
    description: Path to a spec or task file
    required: false
    default: ""
  fail-on:
    description: Comma-separated gates
    required: false
    default: types,tests,crap,secrets,sca
  mutation:
    description: off, diff, or full
    required: false
    default: off
  format:
    description: json, md, sarif, or all
    required: false
    default: sarif
  diff:
    description: Git base ref. Empty skips --diff
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install sc
      shell: bash
      run: cargo install --path crates/sc-cli --locked --force
    - name: Analyze
      shell: bash
      run: |
        case "${{ inputs.format }}" in
          md) out=sc-results.md ;;
          json) out=sc-results.json ;;
          *) out=sc-results.sarif ;;
        esac
        args=(analyze . --format "${{ inputs.format }}" --out "$out" --fail-on "${{ inputs.fail-on }}" --mutation "${{ inputs.mutation }}")
        if [ -n "${{ inputs.spec }}" ]; then
          args+=(--spec "${{ inputs.spec }}")
        fi
        if [ -n "${{ inputs.diff }}" ]; then
          args+=(--diff "${{ inputs.diff }}")
        fi
        sc "${args[@]}"
    - name: Upload SARIF
      if: inputs.format == 'sarif' || inputs.format == 'all'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: sc-results.sarif
