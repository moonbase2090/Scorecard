name: sc
description: Run the sc scorecard gate and upload the report
branding:
  icon: check-circle
  color: green
inputs:
  spec:
    description: Path to a spec or task file
    required: false
    default: ""
  fail-on:
    description: Comma-separated gates whose failures fail the process. Use none by itself to suppress gate failures from the exit code. Empty is invalid; omit this input to use the default gates.
    required: false
    default: types,tests,crap,secrets,lint
  mutation:
    description: off, diff, or full
    required: false
    default: off
  format:
    description: json, md, sarif, html, or all
    required: false
    default: sarif
  diff:
    description: Git base ref. Empty skips --diff
    required: false
    default: ""
  version:
    description: Release to install, such as 0.1.6. Empty uses the action ref when it is a v* tag, otherwise the latest release.
    required: false
    default: ""
  build-from-source:
    description: Build sc from this checkout instead of installing a release
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install sc
      shell: bash
      env:
        SC_VERSION: ${{ inputs.version }}
        SC_ACTION_REF: ${{ github.action_ref }}
        SC_BUILD_FROM_SOURCE: ${{ inputs.build-from-source }}
      run: |
        set -eu
        install_from_source() {
          echo "building sc from source"
          cargo install --path "${{ github.action_path }}/../crates/sc-cli" --locked --force
        }
        case "$SC_BUILD_FROM_SOURCE" in
          true)
            install_from_source
            exit 0
            ;;
          false|"")
            ;;
          *)
            echo "build-from-source must be true or false" >&2
            exit 2
            ;;
        esac
        curl_gh() {
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" "$@"
          else
            curl -fsSL "$@"
          fi
        }
        ver="$SC_VERSION"
        if [ -z "$ver" ]; then
          case "${SC_ACTION_REF:-}" in
            v*) ver="${SC_ACTION_REF#v}" ;;
          esac
        fi
        if [ -z "$ver" ]; then
          body=$(curl_gh https://api.github.com/repos/moonbase2090/Scorecard/releases/latest || true)
          ver=$(printf '%s\n' "$body" | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p' | head -1)
        fi
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) triple=x86_64-unknown-linux-gnu ;;
          Linux-ARM64) triple=aarch64-unknown-linux-gnu ;;
          macOS-X64) triple=x86_64-apple-darwin ;;
          macOS-ARM64) triple=aarch64-apple-darwin ;;
          *) triple="" ;;
        esac
        asset="sc-v${ver}-${triple}.tar.gz"
        base="https://github.com/moonbase2090/Scorecard/releases/download/v${ver}"
        tmp=$(mktemp -d)
        if [ -n "$triple" ] && [ -n "$ver" ] \
          && curl_gh -o "$tmp/$asset" "$base/$asset" \
          && curl_gh -o "$tmp/SHA256SUMS" "$base/SHA256SUMS"; then
          want=$(awk -v f="$asset" '$2 == f { print $1; exit }' "$tmp/SHA256SUMS")
          if command -v sha256sum >/dev/null 2>&1; then
            got=$(sha256sum "$tmp/$asset" | awk '{ print $1 }')
          else
            got=$(shasum -a 256 "$tmp/$asset" | awk '{ print $1 }')
          fi
          if [ -n "$want" ] && [ "$want" = "$got" ]; then
            tar -xzf "$tmp/$asset" -C "$tmp"
            mkdir -p "$HOME/.local/bin"
            install -m 755 "$tmp/sc" "$HOME/.local/bin/sc"
            if [ -f "$tmp/sc-mcp" ]; then
              install -m 755 "$tmp/sc-mcp" "$HOME/.local/bin/sc-mcp"
            fi
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "installed sc v${ver} (${triple})"
          else
            echo "checksum mismatch for ${asset}; building from source"
            install_from_source
          fi
        else
          echo "no matching asset ${asset}; building from source"
          install_from_source
        fi
    - name: Analyze
      shell: bash
      env:
        SC_FORMAT: ${{ inputs.format }}
        SC_FAIL_ON: ${{ inputs.fail-on }}
        SC_MUTATION: ${{ inputs.mutation }}
        SC_SPEC: ${{ inputs.spec }}
        SC_DIFF: ${{ inputs.diff }}
      run: |
        case "$SC_FORMAT" in
          md) out=sc-results.md ;;
          json) out=sc-results.json ;;
          sarif) out=sc-results.sarif ;;
          *) out=sc-results.html ;;
        esac
        args=(analyze . --format "$SC_FORMAT" --out "$out" --fail-on "$SC_FAIL_ON" --mutation "$SC_MUTATION")
        if [ -n "$SC_SPEC" ]; then
          args+=(--spec "$SC_SPEC")
        fi
        if [ -n "$SC_DIFF" ]; then
          args+=(--diff "$SC_DIFF")
        fi
        sc "${args[@]}"
    - name: Upload report
      if: always() && (inputs.format == 'html' || inputs.format == 'all')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: scorecard-report
        path: |
          sc-results.html
          sc-results.md
          sc-results.json
          sc-results.sarif
        if-no-files-found: warn
    - name: Upload SARIF
      if: always() && (inputs.format == 'sarif' || inputs.format == 'all') && github.event.repository.visibility == 'public'
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: sc-results.sarif
