name: sc
description: Run the sc scorecard gate and upload SARIF
inputs:
  spec:
    description: Path to a spec or task file
    required: false
    default: ""
  fail-on:
    description: Comma-separated gates
    required: false
    default: types,tests,crap,secrets,lint
  mutation:
    description: off, diff, or full
    required: false
    default: off
  format:
    description: json, md, sarif, html, or all
    required: false
    default: sarif
  diff:
    description: Git base ref. Empty skips --diff
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install sc
      shell: bash
      run: cargo install --path "${{ github.action_path }}/../crates/sc-cli" --locked --force
    - name: Analyze
      shell: bash
      env:
        SC_FORMAT: ${{ inputs.format }}
        SC_FAIL_ON: ${{ inputs.fail-on }}
        SC_MUTATION: ${{ inputs.mutation }}
        SC_SPEC: ${{ inputs.spec }}
        SC_DIFF: ${{ inputs.diff }}
      run: |
        case "$SC_FORMAT" in
          md) out=sc-results.md ;;
          json) out=sc-results.json ;;
          html) out=sc-results.html ;;
          *) out=sc-results.sarif ;;
        esac
        args=(analyze . --format "$SC_FORMAT" --out "$out" --fail-on "$SC_FAIL_ON" --mutation "$SC_MUTATION")
        if [ -n "$SC_SPEC" ]; then
          args+=(--spec "$SC_SPEC")
        fi
        if [ -n "$SC_DIFF" ]; then
          args+=(--diff "$SC_DIFF")
        fi
        sc "${args[@]}"
    - name: Upload SARIF
      if: always() && (inputs.format == 'sarif' || inputs.format == 'all')
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: sc-results.sarif
