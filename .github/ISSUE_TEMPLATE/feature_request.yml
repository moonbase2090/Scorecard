name: Feature request
description: Propose a new Scorecard capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today, and who it affects
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, including CLI or output shape if known
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: How to check it
      description: How a reviewer would verify the new behavior works
    validations:
      required: false
