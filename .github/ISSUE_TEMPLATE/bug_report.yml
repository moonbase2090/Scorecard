name: Bug report
description: Something in Scorecard behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands run and what went wrong
      placeholder: sc analyze ./my-crate gave verdict fail with no findings
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of sc --version
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, toolchain versions, relevant language toolchains
    validations:
      required: false
