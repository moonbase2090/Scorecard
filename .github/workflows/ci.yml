name: ci

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every PR update runs here only (macOS runners bill 10x on this repo).
  check-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # Fixture tooling the test suite shells out to. ubuntu-latest already
      # ships node/npm, python3, go, JDK+maven+gradle, dotnet, and g++/cmake.
      - name: Install Rust coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: Install lint and coverage tools
        run: |
          pipx install ruff
          sudo npm install -g c8 bats
          sudo apt-get update && sudo apt-get install -y lcov
      # noble has no kcov package: build v43 from source, caching the binary.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: kcov-cache
        with:
          path: /usr/local/bin/kcov
          key: kcov-v43-noble
      - name: Build kcov from source
        if: steps.kcov-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev binutils-dev
          curl -sSL https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz | tar xz -C /tmp
          cmake -S /tmp/kcov-43 -B /tmp/kcov-43/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-43/build -j"$(nproc)"
          sudo cmake --install /tmp/kcov-43/build --prefix /usr/local
          kcov --version
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: pcov
          coverage: pcov
          tools: phpunit, phpstan
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  # macOS coverage runs on pushes to develop and manual dispatch, not PRs.
  # No fixture tooling here (setup-php hung 10+ min): build plus fmt,
  # clippy, and the fixture-free lib unit tests only. Ubuntu covers
  # the full fixture matrix.
  check-macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test core
        run: cargo test --workspace --locked --lib

  # Supply chain and MSRV stay Ubuntu-only and cached, like everything else.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: cargo-deny check
        run: cargo deny check

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@077fee5b0788f1a772d4c6ce2814159cd1d6632b # 1.85
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check MSRV
        run: cargo check --workspace --locked --all-targets

  # Self-analysis on pushes to develop. Plain cargo/sc commands only, so
  # this stays portable if CI moves off GitHub Actions later.
  dogfood:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # Dogfood runs the repo's own test suite, so it needs the same
      # fixture tooling as check-ubuntu (see that job for rationale).
      - name: Install Rust coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: Install lint and coverage tools
        run: |
          pipx install ruff
          sudo npm install -g c8 bats
          sudo apt-get update && sudo apt-get install -y lcov
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: kcov-cache
        with:
          path: /usr/local/bin/kcov
          key: kcov-v43-noble
      - name: Build kcov from source
        if: steps.kcov-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev binutils-dev
          curl -sSL https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz | tar xz -C /tmp
          cmake -S /tmp/kcov-43 -B /tmp/kcov-43/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-43/build -j"$(nproc)"
          sudo cmake --install /tmp/kcov-43/build --prefix /usr/local
          kcov --version
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: pcov
          coverage: pcov
          tools: phpunit, phpstan
      - name: Build sc
        run: cargo build --release --locked -p sc-cli
      # The full instrumented suite is slower on runners than on a dev
      # Mac; the 120s per-command default starves cargo test and clippy.
      - name: Analyze self
        run: ./target/release/sc analyze . --format all --out sc-report --budget-seconds 600
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-dogfood
          path: |
            sc-report.sarif
            sc-report.json
            sc-report.html
          if-no-files-found: warn
