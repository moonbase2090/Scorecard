name: ci

on:
  pull_request:
    branches: [develop, main, docs/task-based-docs]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every PR update runs here only (macOS runners bill 10x on this repo).
  check-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Fixture tooling the test suite shells out to. ubuntu-latest already
      # ships node/npm, python3, go, JDK+maven+gradle, dotnet, and g++/cmake.
      - name: Install Rust coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: Install lint and coverage tools
        run: |
          pipx install ruff
          sudo npm install -g c8 bats
          sudo apt-get update && sudo apt-get install -y lcov
      # noble has no kcov package: build v43 from source, caching the binary.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: kcov-cache
        with:
          path: /usr/local/bin/kcov
          key: kcov-v43-noble
      - name: Build kcov from source
        if: steps.kcov-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev binutils-dev
          curl -sSL https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz | tar xz -C /tmp
          cmake -S /tmp/kcov-43 -B /tmp/kcov-43/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-43/build -j"$(nproc)"
          sudo cmake --install /tmp/kcov-43/build --prefix /usr/local
          kcov --version
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: pcov
          coverage: pcov
          tools: phpunit, phpstan
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: archive layout
        run: bash scripts/test-archive-layout.sh
      - name: release text check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xar p7zip-full
          bash scripts/test-check-release-text.sh
      - name: release install staging
        run: bash scripts/test-release-install-staging.sh

  # macOS coverage runs on pushes to develop and manual dispatch, not PRs.
  # No fixture tooling here (setup-php hung 10+ min): build plus fmt,
  # clippy, and the fixture-free lib unit tests only. Ubuntu covers
  # the full fixture matrix.
  check-macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test core
        run: cargo test --workspace --locked --lib

  # Supply chain and MSRV stay Ubuntu-only and cached, like everything else.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: cargo-deny check
        run: cargo deny check

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install 1.88 via rustup instead of a second dtolnay pin: two pins
      # from the same action at different refs confuse Dependabot.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - name: Check MSRV
        run: cargo +1.88 check --workspace --locked --all-targets

  # Workspace line coverage via cargo-llvm-cov, with the report as an
  # artifact. Push-only like dogfood: PRs already run the suite without
  # instrumentation. Floor 70 sits just under the measured 72% baseline.
  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Same fixture toolchain as check-ubuntu: llvm-cov runs the full
      # suite including the fixture tests.
      - name: Install Rust coverage tooling
        run: cargo install cargo-llvm-cov --locked
      - name: Install lint and coverage tools
        run: |
          pipx install ruff
          sudo npm install -g c8 bats
          sudo apt-get update && sudo apt-get install -y lcov
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: kcov-cache
        with:
          path: /usr/local/bin/kcov
          key: kcov-v43-noble
      - name: Build kcov from source
        if: steps.kcov-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev binutils-dev
          curl -sSL https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz | tar xz -C /tmp
          cmake -S /tmp/kcov-43 -B /tmp/kcov-43/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-43/build -j"$(nproc)"
          sudo cmake --install /tmp/kcov-43/build --prefix /usr/local
          kcov --version
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: pcov
          coverage: pcov
          tools: phpunit, phpstan
      - name: Coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path coverage.lcov --fail-under-lines 70
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.lcov
          if-no-files-found: warn

  # Self-analysis on pushes to develop. Plain cargo/sc commands only, so
  # this stays portable if CI moves off GitHub Actions later.
  dogfood:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Dogfood runs the repo's own test suite, so it needs the same
      # fixture tooling as check-ubuntu (see that job for rationale).
      - name: Install Rust coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: Install lint and coverage tools
        run: |
          pipx install ruff
          sudo npm install -g c8 bats
          sudo apt-get update && sudo apt-get install -y lcov
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: kcov-cache
        with:
          path: /usr/local/bin/kcov
          key: kcov-v43-noble
      - name: Build kcov from source
        if: steps.kcov-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev binutils-dev
          curl -sSL https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz | tar xz -C /tmp
          cmake -S /tmp/kcov-43 -B /tmp/kcov-43/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-43/build -j"$(nproc)"
          sudo cmake --install /tmp/kcov-43/build --prefix /usr/local
          kcov --version
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: pcov
          coverage: pcov
          tools: phpunit, phpstan
      - name: Build sc
        run: cargo build --release --locked -p sc-cli
      # The full instrumented suite is slower on runners than on a dev
      # Mac; the 120s per-command default starves cargo test and clippy.
      - name: Analyze self
        run: ./target/release/sc analyze . --format all --out sc-report --budget-seconds 600
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-dogfood
          path: |
            sc-report.sarif
            sc-report.json
            sc-report.html
          if-no-files-found: warn
