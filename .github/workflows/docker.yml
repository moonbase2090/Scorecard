name: docker

# Build the runtime image on pull requests. Push it only for a v* release tag,
# using the workflow token the release workflow already uses to publish assets.
on:
  pull_request:
    branches: [develop, main, docs/task-based-docs]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: sc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image
        run: |
          set -eu
          got=$(docker run --rm sc:ci --version)
          printf '%s\n' "$got"
          case "$got" in
            sc\ [0-9]*) ;;
            *)
              echo "error: sc --version from the image was '$got'" >&2
              exit 1
              ;;
          esac
          mcp=$(docker run --rm --entrypoint sc-mcp sc:ci --version)
          printf '%s\n' "$mcp"
          case "$mcp" in
            [0-9]*) ;;
            *)
              echo "error: sc-mcp --version from the image was '$mcp'" >&2
              exit 1
              ;;
          esac
          docker run --rm --entrypoint git sc:ci --version
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push release image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          image="ghcr.io/moonbase2090/scorecard"
          docker tag sc:ci "${image}:${GITHUB_REF_NAME}"
          docker push "${image}:${GITHUB_REF_NAME}"
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "prerelease tag; leaving ${image}:latest unchanged"
              ;;
            *)
              docker tag sc:ci "${image}:latest"
              docker push "${image}:latest"
              ;;
          esac
