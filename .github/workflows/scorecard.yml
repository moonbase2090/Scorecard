name: scorecard

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./action
        with:
          format: all
          fail-on: ""
